ce" font-size="23" font-weight="bold" fill="#E0A82E">4 · RESOLVE</text><text x="1004" y="412" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="19" fill="#ECE7DC">keeper · Chainlink</text><text x="1004" y="444" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="17" fill="#6B7893">resolveByOracle</text><rect x="1282" y="300" width="250" height="210" rx="12" fill="#0B121F" stroke="#1B2740" stroke-width="1.5"/><rect x="1282" y="300" width="250" height="5" rx="2" fill="#E0A82E"/><text x="1302" y="356" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="23" font-weight="bold" fill="#E0A82E">5 · REVEAL</text><text x="1302" y="412" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="19" fill="#ECE7DC">Zama KMS</text><text x="1302" y="444" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="17" fill="#6B7893">aggregate + fee</text><rect x="1580" y="300" width="250" height="210" rx="12" fill="#0B121F" stroke="#1B2740" stroke-width="1.5"/><rect x="1580" y="300" width="250" height="5" rx="2" fill="#ECE7DC"/><text x="1600" y="356" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="23" font-weight="bold" fill="#ECE7DC">6 · CLAIM</text><text x="1600" y="412" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="19" fill="#ECE7DC">on-ciphertext</text><text x="1600" y="444" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="17" fill="#6B7893">userDecrypt/EIP712</text>
