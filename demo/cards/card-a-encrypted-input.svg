<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#050911"/>
  <rect x="0" y="0" width="1920" height="6" fill="#E0A82E"/>
  <!-- header -->
  <text x="120" y="130" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="40" font-weight="bold" fill="#E0A82E" letter-spacing="4">PRI</text>
  <text x="235" y="118" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="19" fill="#6B7893" letter-spacing="3">PREDICTION</text>
  <text x="235" y="140" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="19" fill="#6B7893" letter-spacing="3">MARKETS</text>
  <text x="1800" y="130" text-anchor="end" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="22" fill="#6B7893" letter-spacing="2">1 / 3 · TECHNICAL HIGHLIGHT</text>
  <line x1="120" y1="175" x2="1800" y2="175" stroke="#1B2740" stroke-width="1.5"/>
  <!-- kicker + title -->
  <text x="120" y="270" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="26" fill="#4FD1C5" letter-spacing="6">SEALED INPUT</text>
  <text x="120" y="355" font-family="'DejaVu Sans','Helvetica',sans-serif" font-size="66" font-weight="bold" fill="#ECE7DC">One proof — side AND amount encrypted</text>
  <!-- code panel -->
  <rect x="110" y="410" width="1700" height="470" rx="14" fill="#0B121F" stroke="#1B2740" stroke-width="1.5"/>
  <circle cx="150" cy="450" r="9" fill="#E0555A"/><circle cx="182" cy="450" r="9" fill="#E0A82E"/><circle cx="214" cy="450" r="9" fill="#4FD1C5"/>
  <text x="150" y="515" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="34" xml:space="preserve"><tspan fill="#ECE7DC">const buf = </tspan><tspan fill="#ECE7DC">fhevmInst</tspan><tspan fill="#6B7893">.</tspan><tspan fill="#E0A82E">createEncryptedInput</tspan><tspan fill="#ECE7DC">(contractAddress, userAddress);</tspan></text>
<text x="150" y="571" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="34" xml:space="preserve"><tspan fill="#ECE7DC">buf.</tspan><tspan fill="#E0A82E">add8</tspan><tspan fill="#ECE7DC">(</tspan><tspan fill="#E0A82E">BigInt</tspan><tspan fill="#ECE7DC">(side));</tspan><tspan fill="#5B6a86">   // 0 = NO, 1 = YES   (encrypted)</tspan></text>
<text x="150" y="627" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="34" xml:space="preserve"><tspan fill="#ECE7DC">buf.</tspan><tspan fill="#E0A82E">add64</tspan><tspan fill="#ECE7DC">(amountRaw);</tspan><tspan fill="#5B6a86">     // cUSDC amount      (encrypted)</tspan></text>
<text x="150" y="683" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="34" xml:space="preserve"><tspan fill="#ECE7DC">const enc = </tspan><tspan fill="#7AA2F7">await</tspan><tspan fill="#ECE7DC"> buf.</tspan><tspan fill="#E0A82E">encrypt</tspan><tspan fill="#ECE7DC">();</tspan></text>
<text x="150" y="739" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="34" xml:space="preserve"><tspan fill="#ECE7DC"></tspan></text>
<text x="150" y="795" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="34" xml:space="preserve"><tspan fill="#5B6a86">// handles[0]=side  handles[1]=amount  inputProof (shared)</tspan></text>
  <!-- caption -->
  <line x1="120" y1="945" x2="1800" y2="945" stroke="#1B2740" stroke-width="1.5"/>
  <text x="120" y="1005" font-family="'DejaVu Sans','Helvetica',sans-serif" font-size="28" fill="#6B7893">Side and amount stay ciphertext — through storage, events, and settlement.</text>
  <text x="1800" y="1052" text-anchor="end" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="22" fill="#E0A82E">pri-markets.vercel.app</text>
</svg>